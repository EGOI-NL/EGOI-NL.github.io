name: Check URL Status

on:
  workflow_dispatch:
  schedule:
    - cron: 0 0 * * 0 # run at midnight every Sunday

env:
  LINK_TRACKING_ISSUE_NUMBER: 85

permissions:
  issues: write

jobs:
  check-urls:
    if: ${{ !github.event.repository.fork }}
    env:
      LYCHEE_REPORT_FILE: ./lychee/out.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Link Checker
        uses: lycheeverse/lychee-action@v2.9.0

      - name: Update link tracking issue
        uses: actions/github-script@v7
        with:
          script: |
            const exitCode = process.env.lychee_exit_code
            if (!/^\d+$/.test(exitCode ?? '')) {
              throw new Error('Lychee did not provide a valid exit code')
            }

            const hasInvalidLinks = exitCode !== '0'
            const body = hasInvalidLinks
              ? require('fs').readFileSync(process.env.LYCHEE_REPORT_FILE, 'utf8')
              : 'No invalid links found! 🤖'
            await github.rest.issues.update({
              ...context.repo,
              issue_number: Number(process.env.LINK_TRACKING_ISSUE_NUMBER),
              state: hasInvalidLinks ? 'open' : 'closed',
              body,
            })

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: lychee-report
          path: ${{ env.LYCHEE_REPORT_FILE }}
